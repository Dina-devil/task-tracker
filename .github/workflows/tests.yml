name: Tests (Unit & Integration)

on:
  push:
    branches: ["main", "master", "develop"]
  pull_request:
    branches: ["main", "master", "develop"]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio httpx pyjwt "passlib[bcrypt]" "sqlalchemy[asyncio]" asyncpg redis email-validator fastapi

      - name: Run unit tests across all services
        run: |
          for svc in auth-service notification-service workspace-service task-service; do
            echo "=== Unit tests: $svc ==="
            (cd "services/$svc" && python -m pytest tests/unit -v -o asyncio_mode=auto)
          done

  integration-tests:
    needs: unit-tests
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio httpx pyjwt "passlib[bcrypt]" "sqlalchemy[asyncio]" asyncpg redis email-validator fastapi

      - name: Create service databases
        env:
          PGPASSWORD: postgres
        run: |
          for db in auth_db notification_db workspace_db task_db; do
            psql -h 127.0.0.1 -p 5432 -U postgres -c "CREATE DATABASE $db;" || true
          done

      - name: Run integration tests
        run: |
          TEST_DATABASE_URL="postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/auth_db" \
            python -m pytest services/auth-service/tests/integration -v -o asyncio_mode=auto

          for svc in notification-service workspace-service task-service; do
            if [ -d "services/$svc/tests/integration" ]; then
              db_name="${svc%-service}_db"
              echo "=== Integration tests: $svc ($db_name) ==="
              (
                cd "services/$svc"
                TEST_DATABASE_URL="postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/$db_name" \
                  python -m pytest tests/integration -v -o asyncio_mode=auto
              )
            fi
          done
